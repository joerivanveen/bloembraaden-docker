# pass the PHP scripts to FastCGI server
#
# See conf.d/php-fpm.conf for socket configuration
#
index index.php;

location / {
    limit_req zone=dynamic burst=24 nodelay;
    try_files $uri /index.php$is_args$args;
}

location /_site/ {
    limit_req zone=instance burst=100 nodelay;
}

location /_front/ {
    root /usr/share/nginx/bloembraaden;
}

location ~ \.php$ {
    fastcgi_intercept_errors on;
    fastcgi_index  index.php;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME /usr/share/nginx/htdocs/index.php;
    fastcgi_pass   php:9000;
}

location ~* ^(?!\/_front\/).+\.(ico|gif|jpg|png|webp|woff|ttf|otf|svg|woff2|eot)$ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
}

location /private_uploads/ {
    internal;
    alias /mnt/uploads/;
    # overwrite DENY so it can be previewed by the application
    add_header X-Frame-Options "SAMEORIGIN";
    # add_header here means the headers from headers.conf are not inherited, so repeat the ones needed for files
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
}

location /umami.js {
    proxy_pass https://cloud.umami.is/script.js;
    proxy_set_header Host cloud.umami.is;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;

    # don't pass on umami's own policy headers, use ours
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;

    # Cache settings (proxy_cache_path is defined in nginx.conf)
    proxy_cache proxy_scripts;
    proxy_cache_valid 200 1h;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    # (no expires directive, it would add a second Cache-Control header)
    add_header Cache-Control "public, max-age=3600";
    # add_header here means the headers from headers.conf are not inherited, so repeat the relevant ones
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
}
